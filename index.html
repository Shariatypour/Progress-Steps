<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A four-step progress indicator built with HTML, CSS, and JavaScript.">
    <link rel="stylesheet" href="css/style.css">
    <title>Progress Steps</title>
</head>
<body>
    <main class="container">
        <p class="eyebrow">A LITTLE PROGRESS, EVERY DAY</p>
        <h1>One step at a time.</h1>
        <p class="intro">Use the buttons to explore this four-step progress demo.</p>

        <div class="progress-container">
            <div class="track" aria-hidden="true">
                <div class="progress" id="progress"></div>
            </div>
            <ol class="steps" aria-label="Progress steps">
                <li class="step active" aria-current="step"><span class="circle">1</span><span class="step-label">Start</span></li>
                <li class="step"><span class="circle">2</span><span class="step-label">Explore</span></li>
                <li class="step"><span class="circle">3</span><span class="step-label">Review</span></li>
                <li class="step"><span class="circle">4</span><span class="step-label">Finish</span></li>
            </ol>
        </div>

        <p class="status" id="status" role="status">Step 1 of 4: Start</p>
        <div class="controls">
            <button class="btn btn-secondary" id="prev" type="button" disabled>Previous</button>
            <button class="btn btn-primary" id="next" type="button">Next</button>
        </div>
    </main>
    <script src="js/script.js"></script>
</body>
</html>
